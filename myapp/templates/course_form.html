<!DOCTYPE html>
<html>
<head>
    <title>Course</title>
</head>
<body>

<h1>
    {% if course %}
        Edit Course
    {% else %}
        Create Course
    {% endif %}
</h1>

<form method="post">

    {% csrf_token %}

    <p>
        <label>Title:</label>
        <input type="text" name="title" value="{{ course.title }}">
    </p>

    <p>
        <label>Description:</label>
        <textarea name="description"> {{ course.description }}</textarea> </p>
    
    <p>
        <label>Price:</label>
        <input type="number" name="price" value="{{ course.price }}" >
    </p>

    <button type="submit">Save</button>
</form>

</body>
</html>
