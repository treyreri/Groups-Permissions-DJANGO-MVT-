<!DOCTYPE html>
<html>
<head>
    <title>Lesson</title>
</head>
<body>

<h1> {% if lesson %} Edit Lesson
    {% else %} Create Lesson
    {% endif %} </h1>



<form method="post">

    {% csrf_token %}
    <p>
        <label>Title:</label>

        <input type="text" name="title" value="{{ lesson.title}}" > </p>

    <p>
        <label>Content:</label>
       <textarea name="content">{{ lesson.content }}</textarea>
    </p>

    
    <p>
        <label>Course : </label>

        <select name="course">

            {% for course in courses %}

                <option value="{{ course.id }}"
                    {% if lesson.course.id == course.id %} selected {% endif %}> 
                    {{ course.title }}
                </option>
            {% endfor %}
        </select>
    </p>

    <button type="submit"> Save </button>

</form>

</body>
</html>
